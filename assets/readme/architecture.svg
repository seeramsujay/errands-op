<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">errands-op - Algorithmic System Architecture</title>
  <desc id="arch-desc">Four-stage pipeline connecting Home Assistant sync, Hybrid VRPTW engine, dual-ring geofence hysteresis, and layout DAG walk learning.</desc>
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="16" fill="url(#archBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Architecture Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">MATHEMATICAL ENGINE PIPELINE</text>
    <text x="0" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800">
      Closed-Loop Multi-Stop Optimization Architecture
    </text>
  </g>

  <!-- Flow Pipeline: 4 Main Modular Blocks -->
  <g transform="translate(50, 110)">
    
    <!-- Block 1: Sync Layer -->
    <g transform="translate(0, 0)">
      <rect width="250" height="210" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
      <rect width="250" height="6" rx="3" fill="#6366F1"/>
      <text x="20" y="36" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">1. HA &amp; HLC Sync</text>
      <text x="20" y="60" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">Offline Delta Queue</text>
      
      <g transform="translate(20, 80)">
        <text x="0" y="16" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Home Assistant WS Client</text>
        <text x="0" y="38" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Hybrid Logical Clock (HLC)</text>
        <text x="0" y="60" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Last-Write-Wins (LWW)</text>
        <text x="0" y="82" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Preserves human order</text>
      </g>
      <rect x="20" y="174" width="130" height="22" rx="4" fill="#020617" stroke="#334155" stroke-width="0.8"/>
      <text x="28" y="189" fill="#10B981" font-family="ui-monospace, monospace" font-size="10">Causal Monotonicity</text>
    </g>

    <!-- Connector 1 -->
    <path d="M 252, 105 L 282, 105" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="282,101 288,105 282,109" fill="#6366F1"/>

    <!-- Block 2: Spatial & VRP Solver -->
    <g transform="translate(290, 0)">
      <rect width="260" height="210" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
      <rect width="260" height="6" rx="3" fill="#14B8A6"/>
      <text x="20" y="36" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">2. Hybrid VRPTW</text>
      <text x="20" y="60" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">Multi-Stop Solver</text>
      
      <g transform="translate(20, 80)">
        <text x="0" y="16" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Geohash-6 Distance Matrix</text>
        <text x="0" y="38" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Road Tortuosity (τ = 1.28)</text>
        <text x="0" y="60" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Thermal Penalty (γ = 250)</text>
        <text x="0" y="82" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Hard Lock Pinning (📌)</text>
      </g>
      <rect x="20" y="174" width="140" height="22" rx="4" fill="#020617" stroke="#334155" stroke-width="0.8"/>
      <text x="28" y="189" fill="#14B8A6" font-family="ui-monospace, monospace" font-size="10">Constraint Cascade</text>
    </g>

    <!-- Connector 2 -->
    <path d="M 552, 105 L 582, 105" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="582,101 588,105 582,109" fill="#14B8A6"/>

    <!-- Block 3: Dual-Ring Geofence -->
    <g transform="translate(590, 0)">
      <rect width="250" height="210" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
      <rect width="250" height="6" rx="3" fill="#F59E0B"/>
      <text x="20" y="36" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">3. Geofence Engine</text>
      <text x="20" y="60" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">Dual-Ring Hysteresis</text>
      
      <g transform="translate(20, 80)">
        <text x="0" y="16" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• 2D Kalman GPS Filter</text>
        <text x="0" y="38" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Noise Cutoff: σ &gt; 30m</text>
        <text x="0" y="60" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• R_in = 40m (120s dwell)</text>
        <text x="0" y="82" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• R_out = 80m (180s grace)</text>
      </g>
      <rect x="20" y="174" width="130" height="22" rx="4" fill="#020617" stroke="#334155" stroke-width="0.8"/>
      <text x="28" y="189" fill="#F59E0B" font-family="ui-monospace, monospace" font-size="10">Zero Drift Triggers</text>
    </g>

    <!-- Connector 3 -->
    <path d="M 842, 105 L 872, 105" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="872,101 878,105 872,109" fill="#F59E0B"/>

    <!-- Block 4: DAG Learning Engine -->
    <g transform="translate(880, 0)">
      <rect width="220" height="210" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
      <rect width="220" height="6" rx="3" fill="#06B6D4"/>
      <text x="20" y="36" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">4. Layout DAG</text>
      <text x="20" y="60" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">Walk Order Learning</text>
      
      <g transform="translate(20, 80)">
        <text x="0" y="16" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Timestamp check-offs</text>
        <text x="0" y="38" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Exp-decay edge weights</text>
        <text x="0" y="60" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Feedback Arc Set (FAS)</text>
        <text x="0" y="82" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="12">• Kahn's Toposort</text>
      </g>
      <rect x="20" y="174" width="130" height="22" rx="4" fill="#020617" stroke="#334155" stroke-width="0.8"/>
      <text x="28" y="189" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10">Cycle-Free Aisle Walk</text>
    </g>

  </g>
</svg>
