<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="comp-title comp-desc">
  <title id="comp-title">Traditional Errand Apps vs errands-op</title>
  <desc id="comp-desc">Comparison matrix highlighting non-destructive overlays, thermal decay deferral, hysteresis geofencing, and learned in-store DAG walk order.</desc>
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#compBg)" stroke="#334155" stroke-width="1.5"/>

  <g transform="translate(50, 36)">
    <text x="0" y="0" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">ARCHITECTURAL CONTRAST</text>
    <text x="0" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800">
      Traditional Errand Apps vs errands-op
    </text>
  </g>

  <!-- Left: Traditional Apps -->
  <g transform="translate(50, 95)">
    <rect width="520" height="210" rx="12" fill="#111827" stroke="#374151" stroke-width="1.2"/>
    <text x="24" y="32" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">❌ Traditional Route &amp; To-Do Apps</text>

    <g transform="translate(24, 52)">
      <text x="0" y="20" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="13">✕ Destructive sort: Overwrites human list order irrevocably</text>
      <text x="0" y="48" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="13">✕ Agnostic to groceries: Puts ice cream at stop #1 (melts by stop #4)</text>
      <text x="0" y="76" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="13">✕ Single GPS radius: Triggers false notifications when driving past</text>
      <text x="0" y="104" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="13">✕ Dumb store checklists: Unsorted items force zigzagging back and forth</text>
      <text x="0" y="132" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="13">✕ Proprietary cloud sync: Locked into siloed third-party servers</text>
    </g>
  </g>

  <!-- Right: errands-op -->
  <g transform="translate(610, 95)">
    <rect width="540" height="210" rx="12" fill="#0B132B" stroke="#6366F1" stroke-width="1.5"/>
    <text x="24" y="32" fill="#10B981" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">✨ errands-op Engine</text>

    <g transform="translate(24, 52)">
      <text x="0" y="20" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="13">✓ <tspan font-weight="bold">Non-destructive overlays:</tspan> Preserves human list + hard sequence pins</text>
      <text x="0" y="48" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="13">✓ <tspan font-weight="bold">Thermal decay penalty (γ = 250):</tspan> Defers perishables to final leg</text>
      <text x="0" y="76" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="13">✓ <tspan font-weight="bold">Dual-ring hysteresis (40m / 80m):</tspan> 120s dwell, Kalman GPS filter</text>
      <text x="0" y="104" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="13">✓ <tspan font-weight="bold">Learned walk-order DAG:</tspan> Kahn's toposort orders aisles empirically</text>
      <text x="0" y="132" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="13">✓ <tspan font-weight="bold">Home Assistant WebSocket + HLC:</tspan> 100% self-hosted local-first</text>
    </g>
  </g>
</svg>
